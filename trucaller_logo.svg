<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="60%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#2A2A2A"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1A1A"/>
      <stop offset="100%" style="stop-color:#B00020"/>
    </linearGradient>

    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE033"/>
      <stop offset="100%" style="stop-color:#FFA800"/>
    </linearGradient>

    <linearGradient id="ugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE033"/>
      <stop offset="100%" style="stop-color:#FFA800"/>
    </linearGradient>

    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="yellowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="drop">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="badgeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="ugGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="icon">
      <rect x="0" y="0" width="1024" height="1024" rx="235" ry="235"/>
    </clipPath>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#CC0000;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#icon)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>
    <rect width="1024" height="1024" fill="url(#centerGlow)"/>

    <!-- Dot grid -->
    <pattern id="dots" patternUnits="userSpaceOnUse" width="34" height="34">
      <circle cx="17" cy="17" r="1.2" fill="#FFE033" opacity="0.07"/>
    </pattern>
    <rect width="1024" height="1024" fill="url(#dots)"/>

    <!-- Decorative rings -->
    <circle cx="512" cy="512" r="430" fill="none" stroke="#CC0000" stroke-width="2" stroke-opacity="0.18"/>
    <circle cx="512" cy="512" r="400" fill="none" stroke="#FFD700" stroke-width="1" stroke-opacity="0.10"/>

    <!-- Shield -->
    <g filter="url(#redGlow)">
      <path d="M512 148 L768 258 L768 494 C768 662 652 764 512 850 C372 764 256 662 256 494 L256 258 Z"
            fill="#CC0000" fill-opacity="0.20"
            stroke="url(#shieldGrad)"
            stroke-width="5.5"
            stroke-opacity="0.85"
            filter="url(#drop)"/>
    </g>
    <path d="M512 210 L724 300 L724 490 C724 636 622 728 512 806 C402 728 300 636 300 490 L300 300 Z"
          fill="none" stroke="#FF4444" stroke-width="1.5" stroke-opacity="0.15"/>

    <!-- Phone icon -->
    <g transform="translate(512,490)" filter="url(#yellowGlow)">
      <rect x="-158" y="-195" width="90" height="128" rx="45" ry="45" fill="url(#phoneGrad)"/>
      <rect x="68" y="67" width="90" height="128" rx="45" ry="45" fill="url(#phoneGrad)"/>
      <path d="M -113,-67 C -113,58 113,58 113,173"
            fill="none" stroke="url(#phoneGrad)" stroke-width="70" stroke-linecap="round"/>
      <rect x="-158" y="-195" width="90" height="128" rx="45" ry="45" fill="url(#phoneGrad)"/>
      <rect x="68" y="67" width="90" height="128" rx="45" ry="45" fill="url(#phoneGrad)"/>
      <rect x="-145" y="-182" width="42" height="55" rx="21" ry="21" fill="white" opacity="0.18"/>
    </g>

    <!-- Verified badge -->
    <g transform="translate(668,648)" filter="url(#badgeGlow)">
      <circle r="88" fill="#000" opacity="0.4" transform="translate(4,6)"/>
      <circle r="84" fill="#CC0000"/>
      <circle r="84" fill="none" stroke="#FFD700" stroke-width="5" stroke-opacity="0.8"/>
      <polyline points="-30,2 -8,28 36,-26"
                fill="none" stroke="#FFE033" stroke-width="18"
                stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- UG pill label — top-right corner -->
    <g transform="translate(820, 110)" filter="url(#ugGlow)">
      <!-- Pill background -->
      <rect x="-68" y="-28" width="136" height="56" rx="28" ry="28"
            fill="#CC0000" stroke="#FFD700" stroke-width="3"/>
      <!-- UG text -->
      <text x="0" y="10"
            font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
            font-weight="900"
            font-size="34"
            fill="url(#ugGrad)"
            text-anchor="middle"
            letter-spacing="4">UG</text>
    </g>

    <!-- Glow accents -->
    <ellipse cx="260" cy="120" rx="350" ry="140" fill="#FF2222" opacity="0.05" transform="rotate(-18,260,120)"/>
    <ellipse cx="800" cy="880" rx="280" ry="180" fill="#FFD700" opacity="0.04"/>
  </g>
</svg>
