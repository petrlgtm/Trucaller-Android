ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.trucaller.backend.ApplicationKt.module ]
    }
}

mongo {
    uri = "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/?retryWrites=true&w=majority&maxPoolSize=50&minPoolSize=5&maxIdleTimeMS=60000&connectTimeoutMS=10000&socketTimeoutMS=30000"
    uri = ${?MONGO_URI}
    database = "trucaller"
}

jwt {
    secret = "change-me-in-production"
    secret = ${?JWT_SECRET}
    issuer = "trucaller-backend"
    audience = "trucaller-users"
    realm = "trucaller"
}

security {
    cors {
        allowedOrigins = "http://localhost:3000,https://trucaller-backend.onrender.com"
        allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
    }
    rateLimit {
        authRequestsPerMin = 100
        unauthRequestsPerMin = 10
    }
    maxRequestBodyBytes = 1048576
}
