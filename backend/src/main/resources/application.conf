ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.trucaller.backend.ApplicationKt.module ]
    }
}

mongo {
    uri = "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/?retryWrites=true&w=majority"
    uri = ${?MONGO_URI}
    database = "trucaller"
}

jwt {
    secret = "change-me-in-production"
    secret = ${?JWT_SECRET}
    issuer = "trucaller-backend"
    audience = "trucaller-users"
    realm = "trucaller"
}
